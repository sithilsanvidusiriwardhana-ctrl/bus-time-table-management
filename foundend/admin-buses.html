<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Management | Bus Time Table</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body">
    <div class="page-shell">
      <nav class="page-nav" aria-label="Portal navigation">
        <a href="index.html">Home</a><a href="passenger.html">Passenger</a><a href="driver.html">Driver</a><a href="admin.html">Admin</a>
      </nav>
      <main class="page-main admin-layout">
        <aside class="admin-side-nav" aria-label="Admin management">
          <h3>Admin tools</h3>
          <a href="admin-schedules.html">Schedule management</a>
          <a href="admin-routes.html">Route timetables</a>
          <a href="admin-buses.html" class="active">Bus management</a>
          <a href="admin-drivers.html">Driver management</a>
        </aside>
        <section id="dashboardSection" class="dashboard-shell">
          <div class="dashboard-header">
            <div><p class="eyebrow">Admin workspace</p><h2 id="dashboardTitle">Bus management</h2></div>
            <div class="dashboard-actions"><span id="userRoleBadge" class="role-badge">Admin</span><button id="logoutBtn" class="btn btn-secondary" type="button">Logout</button></div>
          </div>
          <div id="welcomeCard" class="welcome-card"></div>
          <div id="adminPanel" class="panel">
            <div class="panel-heading"><h3>Register buses</h3><p>Each bus is assigned to one route and appears only on that route's schedules.</p></div>
            <form id="busForm" class="schedule-form">
              <div class="field-group"><label for="busNumberInput">Bus number</label><input id="busNumberInput" name="busNumber" type="text" required /></div>
              <div class="field-group"><label for="busRouteInput">Assigned route</label><select id="busRouteInput" name="routeNumber" required><option value="">— Select a route —</option></select></div>
              <div class="field-group"><label for="busTypeInput">Bus type</label><select id="busTypeInput" name="busType"><option value="Normal">Normal</option><option value="Semi Luxiri">Semi Luxiri</option><option value="Luxire">Luxire</option></select></div>
              <button id="busSubmitBtn" class="btn btn-primary" type="submit">Register bus</button>
            </form>
            <p id="busMessage" class="form-success" role="status"></p>
            <div class="table-wrap"><div id="busManagementList"></div></div>
          </div>
          <div id="driverPanel" class="panel hidden"></div><div id="passengerPanel" class="panel hidden"></div>
        </section>
      </main>
    </div>
    <script src="otp-utils.js"></script><script src="app.js"></script><script src="portal-auth.js"></script>
  </body>
</html>
