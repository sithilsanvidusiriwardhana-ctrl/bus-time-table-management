<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Portal | Bus Time Table</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body">
    <div class="page-shell">
      <nav class="page-nav" aria-label="Portal navigation">
        <a href="index.html">Home</a>
        <a href="passenger.html">Passenger</a>
        <a href="driver.html" class="active">Driver</a>
        <a href="admin.html">Admin</a>
      </nav>

      <main class="page-main">

        <section id="dashboardSection" class="dashboard-shell">
          <div class="dashboard-header">
            <div>
              <p class="eyebrow">Signed in as</p>
              <h2 id="dashboardTitle">Driver dashboard</h2>
            </div>
            <div class="dashboard-actions">
              <span id="userRoleBadge" class="role-badge">Driver</span>
              <button id="logoutBtn" class="btn btn-secondary" type="button">Logout</button>
            </div>
          </div>

          <div id="welcomeCard" class="welcome-card"></div>

          <div id="adminPanel" class="panel hidden"></div>
          <div id="driverPanel" class="panel hidden">
            <div class="panel-heading" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem;">
              <div>
                <h3>Driver schedule board</h3>
                <p>Review your assigned trips and update the live status.</p>
              </div>
              <button id="openDriverPriceTable" class="btn btn-secondary" type="button" data-action="open-driver-price-modal">Price Table</button>
            </div>
            <div id="driverTrips"></div>
          </div>
          <div id="passengerPanel" class="panel hidden"></div>

          <!-- Driver Price Table Modal -->
          <div id="driverPriceModal" class="modal hidden" aria-hidden="true">
            <div class="modal-overlay" data-action="close-driver-price-modal"></div>
            <section class="modal-content fare-matrix-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="driverPriceTitle">
              <div class="passenger-timetable-heading">
                <div>
                  <p class="eyebrow">Fare & Ticket Guide</p>
                  <h3 id="driverPriceTitle">Route Price Table</h3>
                </div>
                <button class="timetable-close-btn" type="button" data-action="close-driver-price-modal" aria-label="Close price table">×</button>
              </div>

              <div class="field-group">
                <label for="driverPriceRouteSelect">Select route</label>
                <select id="driverPriceRouteSelect" class="form-control">
                  <option value="">Choose a route</option>
                </select>
              </div>

              <div id="driverFareMatrixContainer" class="fare-matrix-wrap" style="margin-top: 1rem;">
                <p class="helper-text">Select a route to view its stage price matrix.</p>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
    <script src="otp-utils.js"></script>
    <script src="app.js"></script>
    <script src="portal-auth.js"></script>
  </body>
</html>
