<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passenger Portal | Bus Time Table</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body">
    <div class="page-shell">
      <nav class="page-nav" aria-label="Portal navigation">
        <a href="index.html">Home</a>
        <a href="passenger.html" class="active">Passenger</a>
        <a href="driver.html">Driver</a>
        <a href="admin.html">Admin</a>
      </nav>

      <main class="page-main">


        <section id="dashboardSection" class="dashboard-shell">
          <div class="dashboard-header">
            <div>
              <p class="eyebrow">Signed in as</p>
              <h2 id="dashboardTitle">Passenger dashboard</h2>
            </div>
            <div class="dashboard-actions">
              <span id="userRoleBadge" class="role-badge">Passenger</span>
              <button id="logoutBtn" class="btn btn-secondary" type="button">Logout</button>
            </div>
          </div>

          <div id="welcomeCard" class="welcome-card"></div>

          <div id="adminPanel" class="panel hidden"></div>
          <div id="driverPanel" class="panel hidden"></div>
          <div id="passengerPanel" class="panel hidden">
            <div class="panel-heading">
              <h3>Passenger travel board</h3>
              <p>Search routes and choose a bus that fits your plan.</p>
            </div>
            <div class="filter-row">
              <input id="searchRoute" type="text" placeholder="Search route" />
              <select id="statusFilter">
                <option value="All">All</option>
                <option value="On Time">On Time</option>
                <option value="Delayed">Delayed</option>
                <option value="Departed">Departed</option>
              </select>
              <button id="openPassengerTimetable" class="btn btn-secondary" type="button" data-action="open-timetable">Timetable</button>
            </div>
            <div id="passengerTrips"></div>
          </div>
          <div id="passengerTimetableModal" class="modal hidden" aria-hidden="true">
            <div class="modal-overlay" data-action="close-timetable"></div>
            <section class="modal-content passenger-timetable-dialog" role="dialog" aria-modal="true" aria-labelledby="passengerTimetableTitle">
              <div class="passenger-timetable-heading">
                <h3 id="passengerTimetableTitle">Route timetable</h3>
                <button class="timetable-close-btn" type="button" data-action="close-timetable" aria-label="Close timetable">×</button>
              </div>
              <label class="field-group" for="passengerRouteSelect">Select route
                <select id="passengerRouteSelect">
                  <option value="">Choose a route</option>
                </select>
              </label>
              <section id="passengerRouteTimetable" class="passenger-route-timetable" aria-live="polite">
                <p>Select a route to view its timetable.</p>
              </section>
            </section>
          </div>
        </section>
      </main>
    </div>
    <script src="otp-utils.js"></script>
    <script src="app.js"></script>
    <script src="portal-auth.js"></script>
  </body>
</html>
