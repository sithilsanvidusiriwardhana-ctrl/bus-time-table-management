name: Deploy to GitHub Pages

on:
  push:
    branches: [ "developer" ] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build (optional)
        run: echo "No build step required for static HTML"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend  
          branch: gh-pages