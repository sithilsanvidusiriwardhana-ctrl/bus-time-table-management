name: Deploy to GitHub Pages

on:
  push:
    branches: [ "dev" ] # ඔබට deploy කිරීමට අවශ්‍ය branch එකේ නම මෙතက်ට දෙන්න (උදා: dev හෝ main)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build (optional)
        # ඔබ React/Vite වැනි framework එකක් නම් මෙතැන build commands දිය හැක. 
        # සාමාන්‍ය HTML/CSS නම් මෙය අවශ්‍ය නොවේ.
        run: echo "No build step required for static HTML"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend  # මෙතැනට ඔබේ index.html ගොනුව ඇති ෆෝල්ඩරයේ නම දෙන්න (උදා: frontend)
          branch: gh-pages