name: Deploy to GitHub Pages

on:
  push:
    branches: [ "developer" ] # හෝ ඔබේ ප්‍රධාන branch එකේ නම

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Deploy to GitHub Pages

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'foundend'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

